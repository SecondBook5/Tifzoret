name: Live provider integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  provider-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[workflow,test]'
      - run: BULK_RNAFRAME_LIVE=1 pytest -q tests/test_network_provider.py
