name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[workflow,test]'
      - run: pytest -q
      - run: tifzoret validate src/tifzoret/templates/minimal/project.yaml
      - run: tifzoret dry-run src/tifzoret/templates/minimal/project.yaml --no-conda
      - run: python -m build

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: |
          mapfile -t scripts < <(find src/tifzoret/workflow/scripts -name '*.R' | sort)
          echo "Found ${#scripts[@]} R scripts"
          if [ "${#scripts[@]}" -lt 23 ]; then
            echo "::error::expected >=23 R scripts, found ${#scripts[@]} — the R-syntax gate glob has gone stale (see plan Task 1)"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "parsing $script"
            Rscript -e "parse(file='$script')"
          done

  synthetic-conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: tifzoret
          environment-file: environment.yaml
          miniforge-version: latest
          use-mamba: true
      - name: Run fresh-project acceptance workflow
        shell: bash -el {0}
        run: |
          study_dir="$(mktemp -d)"
          tifzoret init "$study_dir" --input counts
          tifzoret validate "$study_dir/project.yaml"
          tifzoret run "$study_dir/project.yaml" --cores 2 --no-conda
          test -s "$study_dir/results/synthetic_demo/all/REPORT.html"
          test -s "$study_dir/results/synthetic_demo/all/manifest.json"
          test -s "$study_dir/results/synthetic_demo/all/figures/index.json"
      - name: Run publication-profile acceptance workflow
        shell: bash -el {0}
        run: |
          pub_dir="$(mktemp -d)"
          tifzoret init "$pub_dir" --input publication
          tifzoret validate "$pub_dir/project.yaml"
          tifzoret run "$pub_dir/project.yaml" --cores 2 --no-conda
          test -s "$pub_dir/results/publication_demo/all/REPORT.html"
          test -s "$pub_dir/results/publication_demo/all/manifest.json"
          test -s "$pub_dir/results/publication_demo/all/contrasts/treated_vs_control/analyses/composition/tables/cell_state_scores.tsv"
          test -s "$pub_dir/results/publication_demo/all/contrasts/treated_vs_control/analyses/regulators/regulators_summary.json"
          test -s "$pub_dir/results/publication_demo/all/contrasts/treated_vs_control/analyses/publication/tables/program_definitions.tsv"
      - name: Run full-profile acceptance workflow
        shell: bash -el {0}
        run: |
          full_dir="$(mktemp -d)"
          tifzoret init "$full_dir" --input publication
          # The full profile adds sva, wgcna, mediation and multilayer on top of the
          # publication set. Three of those four run entirely offline and are what this step
          # covers; they are exactly the stages no acceptance run previously executed.
          #
          # networks and multilayer are excluded deliberately, not because they fail:
          # networks.py calls the live STRING API (it raises in offline mode without a warmed
          # cache), and multilayer consumes networks' edge tables, so including either would
          # make this job depend on a third-party service and go flaky. They keep their
          # existing offline dry-run coverage in tests/integration/test_workflow_dag.py.
          # Disabling networks REQUIRES disabling multilayer -- load_project now enforces
          # that, since multilayer fuses networks' output.
          python3 - "$full_dir/project.yaml" <<'PY'
          import sys, yaml
          path = sys.argv[1]
          data = yaml.safe_load(open(path, encoding="utf-8"))
          data["analysis"]["profile"] = "full"
          data["analysis"]["modules"] = {"networks": False, "multilayer": False}
          open(path, "w", encoding="utf-8").write(yaml.safe_dump(data, sort_keys=False))
          PY
          tifzoret validate "$full_dir/project.yaml"
          tifzoret run "$full_dir/project.yaml" --cores 2 --no-conda
          test -s "$full_dir/results/publication_demo/all/REPORT.html"
          test -s "$full_dir/results/publication_demo/all/manifest.json"
          contrast_dir="$full_dir/results/publication_demo/all/contrasts/treated_vs_control/analyses/advanced"
          # sva: the stage commit d88633a repointed at the family fit, and the stage whose
          # SV-augmented refit needed the shared dispersion fallback. Non-empty sensitivity
          # table means the refit-and-compare branch actually ran, not just the empty-output path.
          test -s "$contrast_dir/sva/tables/surrogate_variables.tsv"
          test -s "$contrast_dir/sva/tables/sva_de_sensitivity.tsv"
          test "$(tail -n +2 "$contrast_dir/sva/tables/sva_de_sensitivity.tsv" | wc -l)" -gt 0
          test -s "$contrast_dir/wgcna/tables/wgcna_hubs.tsv"
          test -s "$contrast_dir/wgcna/wgcna_summary.json"
          test -s "$contrast_dir/mediation/tables/mediation_results.tsv"
          test -s "$contrast_dir/mediation/mediation_summary.json"
