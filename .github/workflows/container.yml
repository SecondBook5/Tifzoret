name: Container

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bulk-rna-frame:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container acceptance workflow
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/_entrypoint.sh \
            bulk-rna-frame:test \
            bash -lc '
              set -euo pipefail
              study_dir="$(mktemp -d)"
              bulk-rna init "$study_dir" --input counts
              bulk-rna run "$study_dir/project.yaml" --cores 2 --no-conda
              test -s "$study_dir/results/synthetic_demo/all/REPORT.html"
              test -s "$study_dir/results/synthetic_demo/all/manifest.json"
              test -s "$study_dir/results/synthetic_demo/all/figures/index.json"
            '
