  verdict: BEST-PRACTICE
  severity: S3
  summary: FRAME tests differential pathway activity with a covariate-adjusted limma moderated t-test; REF uses an unadjusted two-group Wilcoxon rank-sum
  detail: 'REF''s GSVA differential is a per-pathway wilcox.test between the two contrast groups plus a raw mean difference oriented to numerator-minus-denominator; it ignores any design covariates and is low-powered for small n. FRAME fits limma::lmFit + eBayes on the score matrix using the full design formula (covariate-adjusted, moderated t) and extracts the numerator coefficient. Fitting limma on GSVA/ssGSEA scores is the approach recommended in the GSVA vignette and is the stronger analysis, so FRAME improves on REF here. It is still a numeric divergence from published REF (different p-values, different top programs) and is tied to the method divergence in A2-012, so it should be reconciled deliberately rather than silently.

