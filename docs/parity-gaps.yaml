- id: A1-002
  track: A
  area: counts/strandedness
  verdict: BEST-PRACTICE
  severity: S2
  summary: REF strand auto-detection argmaxes assignment rate over modes {0,1,2} and is biased to unstranded; FRAME's dominance ratio is correct
  detail: 'REF strand_test.py runs featureCounts for every mode in strand_test_modes (default [0,1,2]) and picks best = max(mean_assignment_percent). Because unstranded (-s 0) assigns any read regardless of strand, its assignment rate is always >= max(mode1, mode2); with mode 0 in the candidate set the argmax therefore almost always resolves to unstranded, so a genuinely stranded library would be silently mis-counted as unstranded. FRAME (infer_strand_mode) instead requires modes {1,2}, computes dominance = max(m1,m2)/(m1+m2), and only chooses the dominant directional mode when dominance >= strand_min_dominance (default 0.80), else falls back to unstranded. That two-directional dominance ratio is the statistically correct way to infer strandedness and is FRAME improving on a REF flaw. Not exercised by cape evidence: cape''s config pins strandedness: unstranded with strand_test_modes [1,2], so inference never ran and counts still matched exactly.

