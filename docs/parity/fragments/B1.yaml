# Cluster B1 — Figure Set 1, panels A–E (STRING enrichment, STRING networks,
# regulator activity, DoRothEA radial GRN). Track B (figure fidelity).
#
# Architecture note: the FRAME files named in the brief (figures.py,
# publication.R, assemble.py) do NOT plot panels A–E. figures.py only *registers*
# the constructors (PANEL_REGISTRY) and resolves output paths; assemble.py merely
# merges pre-rendered per-panel PDFs; publication.R plots only DE-heatmap/program
# panels. The actual A–E constructors live in workflow/scripts/networks.py
# (A, B, C), regulators.R (D), and grn.py (E). Citations below point to the real
# implementing code plus the registry declaration.

- id: B1-001
  track: B
  area: "Set1-A STRING functional enrichment — directional faceting"
  verdict: FIDELITY-GAP
  severity: S3
  summary: "FRAME pools all genes into one enrichment; REF facets Down / GSEA leading-edge / Up seed sets."
  detail: >
    REF prepare_string_enrichment_bubble binds three separate seed-set enrichment
    tables (string_down_enr, string_le_enr, string_up_enr) and facet_wraps them into
    the three columns seen in the gold PDF ("Downregulated in CAPE", "GSEA leading
    edge", "Upregulated in CAPE"), 8 nonredundant terms each. FRAME enrichment_panel
    runs a SINGLE STRING enrichment call over the pooled up+down gene list (all_genes)
    with no directional split and no faceting, so the entire GSEA-leading-edge seed
    set and the directional separation are absent from the panel. Best practice for a
    directional contrast figure is to preserve the direction, so REF's faceting is
    correct and FRAME is missing it.
  reference:
