- id: B1-015
  track: B
  area: "Set1 A/B/C/E — cohort-specific hardcoding vs configured generality"
  verdict: BEST-PRACTICE
  severity: S4
  summary: "REF hardcodes CAPE-specific gene lists for community/anchor naming; FRAME's configured-panel approach is more general and should not be matched."
  detail: >
    REF names STRING communities and GRN diffusion anchors from hardcoded mouse gene-symbol sets
    (e.g. case_when(any(name %in% c('Casq1','Jph2','Pdlim3')) ...) in the network prep, and the
    epithelial/myogenic anchor vectors in the GRN prep). These will not generalize to other cohorts.
    FRAME derives programs from the project's configured hypothesis panels (program_map) and
    data-driven communities, which is the correct engineering choice. FRAME should keep its
    generalizable approach rather than replicate REF's hardcoded gene lists; the fidelity gaps
    above should be closed with configurable/data-driven rendering, not by copying the constants.
  reference:
    - {file: analysis/cape_xizhao_edits/publication_figure_functions.R, line: 1368}
