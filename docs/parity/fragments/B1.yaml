- id: B1-013
  track: B
  area: "Set1-E DoRothEA radial GRN — sector ordering method"
  verdict: FIDELITY-GAP
  severity: S3
  summary: "REF orders sectors by network-diffusion programs with an exact target-overlap permutation test; FRAME uses configured hypothesis panels on evenly spaced sectors."
  detail: >
    REF prepare_dorothea_grn_panel assigns program membership by personalized-PageRank diffusion
    from epithelial/myogenic anchor seeds (threshold 0.8) with leave-one-out stability and reports
    an EXACT target-overlap permutation P in the subtitle; prepare_dorothea_grn_radial sizes each
    sector proportional to its target count. FRAME grn.py derives programs from configured gene
    panels (program_map over hypothesis_panels) with majority-vote regulator labels, spaces sectors
    evenly by program index (2*pi*i/n), and runs a program-MODULARITY permutation test (not the
    target-overlap separation test). The sector semantics and the reported statistic differ.
  reference:
    - {file: analysis/cape_xizhao_edits/publication_figure_functions.R, line: 2207}
    - {file: analysis/cape_xizhao_edits/publication_figure_functions.R, line: 2657}
