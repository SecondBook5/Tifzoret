- id: A1-011
  track: A
  area: qc/de
  verdict: REGRESSION
  severity: S3
  summary: FRAME uses varianceStabilizingTransformation() where REF uses the faster subset-based vst(), so VST-derived figures diverge
  detail: >
    REF computes the variance-stabilized matrix with vst() in both the QC stage (blind=TRUE) and
    the core DE stage (blind=FALSE). vst() fits the dispersion trend on a ~1000-gene subset for
    large matrices, which is the DESeq2-recommended fast path. FRAME calls
    varianceStabilizingTransformation() in both qc.R (blind=TRUE) and de.R (blind=FALSE), which
    fits on all genes. blind matches on both sides, but for the 25k-57k-gene matrices here the two
    functions produce slightly different transformed values, so the QC PCA/correlation/distance and
    the DE heatmap/contrast-PCA coordinates differ from REF's published figures. FRAME's transform
    is arguably more exact but is slower and breaks figure parity; none of this touches the DESeq2
    test statistics (VST feeds only figures, which the DE evidence does not compare).
  reference:
    - {file: workflow/stages/qc/stage.R, line: 906}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/qc.R, line: 33}
