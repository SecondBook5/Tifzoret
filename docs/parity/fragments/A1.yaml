- id: A1-002
  track: A
  area: counts/strandedness
  verdict: BEST-PRACTICE
  severity: S2
  summary: REF strand auto-detection argmaxes assignment rate over modes {0,1,2} and is biased to unstranded; FRAME's dominance ratio is correct
  detail: >
    REF strand_test.py runs featureCounts for every mode in strand_test_modes (default [0,1,2])
    and picks best = max(mean_assignment_percent). Because unstranded (-s 0) assigns any read
    regardless of strand, its assignment rate is always >= max(mode1, mode2); with mode 0 in the
    candidate set the argmax therefore almost always resolves to unstranded, so a genuinely
    stranded library would be silently mis-counted as unstranded. FRAME (infer_strand_mode)
    instead requires modes {1,2}, computes dominance = max(m1,m2)/(m1+m2), and only chooses the
    dominant directional mode when dominance >= strand_min_dominance (default 0.80), else falls
    back to unstranded. That two-directional dominance ratio is the statistically correct way to
    infer strandedness and is FRAME improving on a REF flaw. Not exercised by cape evidence:
    cape's config pins strandedness: unstranded with strand_test_modes [1,2], so inference never
    ran and counts still matched exactly.
  reference:
    - {file: workflow/stages/core/strand_test.py, line: 48}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/materialize_inputs.py, line: 243}
  evidence: code-only
  target: stats
  status: open
  commit: null

- id: A1-003
  track: A
  area: de
  verdict: FIDELITY-GAP
  severity: S4
  summary: DE low-count prefilter is a configurable knob in REF but hardcoded to 10 in FRAME
  detail: >
    REF applies keep <- rowSums(matrix) >= snakemake@params[["minimum"]] where minimum is
    config["qc"]["min_total_counts_per_gene"] (default 10, overridable per study). FRAME de.R
    hardcodes keep <- rowSums(counts) >= 10L and the project schema exposes no min-count field at
    all, so the threshold cannot be changed without editing source. For cape the effective value
    is 10 on both sides, so the DE numerics match (de_equivalence.json: 24903 shared genes,
    0 mismatches). The gap is generality/reproducibility: a cohort that needs a different prefilter
    (or that documented one) cannot express it, and the value is not surfaced in de_summary.json.
