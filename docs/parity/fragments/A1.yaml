- id: A1-009
  track: A
  area: de/annotation
  verdict: BEST-PRACTICE
  severity: S3
  summary: FRAME uses GTF-first symbols (never NA) while REF's numeric DE table uses orgdb-only mapIds that leaves NA/raw ids
  detail: >
    REF's numeric DE stage (core/deseq2.R decorate()) resolves symbols with mapIds(org.Mm.eg.db,
    keytype=ENSEMBL, column=SYMBOL, multiVals="first"), which returns NA for any gene missing from
    the lagging orgdb snapshot - the exact leak REF's own workflow/lib/annotate.R was written to
    fix. FRAME resolves symbols GTF-first: materialize_inputs.write_annotation derives gene_symbol
    from the GRCm39-107 GTF gene_name (falling back to the version-stripped id), and de.R joins by
    gene_id and coalesces empty/NA symbols to the gene_id, so a symbol is never NA. That matches
    the GTF-first philosophy REF's audit endorsed and is an improvement over the orgdb-only core
    table. Residual minor gap: FRAME omits the orgdb middle tier that REF's annotate.R keeps
    (GTF -> orgdb -> id), so a gene absent from the GTF but present in orgdb falls straight back to
    its raw id in FRAME. Annotation is a label/figure concern only - the gene_id join is exact
    (counts and DE match on gene_id), so numerics are unaffected.
  reference:
    - {file: workflow/stages/core/deseq2.R, line: 37}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/de.R, line: 78}
  evidence: run
  target: stats
  status: open
  commit: null

- id: A1-010
  track: A
  area: qc
  verdict: REGRESSION
  severity: S3
  summary: FRAME QC computes VST/PCA on the full unfiltered matrix; REF QC first drops genes below the min-count threshold
  detail: >
    REF QC (qc/stage.R build_deseq_qc_objects) applies keep_mask <- rowSums(counts(dds)) >=
    min_total_counts (default 10) before computing the blind VST, so PCA, sample correlation,
    sample distance and the most-variable-genes heatmap are built on expressed genes only. FRAME
    qc.R builds DESeqDataSetFromMatrix on the full counts matrix with no prefilter and runs the VST
    on every gene, so tens of thousands of near-zero-count genes enter the variance-stabilized
    matrix and shift the unsupervised QC coordinates relative to REF's published figures. This is a
    figure-fidelity regression (FRAME drops a REF preprocessing step); no numeric DE evidence covers
    it. Note the DE-stage prefilter (A1-003) is unaffected - this concerns only the QC stage.
