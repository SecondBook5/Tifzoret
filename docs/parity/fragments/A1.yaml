- id: A1-001
  track: A
  area: counts
  verdict: OK
  severity: S2
  summary: featureCounts command construction is byte-for-byte equivalent; counts exactly equal on cape
  detail: >
    REF (count_genes.py) and FRAME (materialize_inputs.featurecounts_command) build the
    identical featureCounts invocation: -F GTF, -t <feature_type=exon>, -g <attribute=gene_id>,
    -s <mode>, and the same optional flags -p (paired_end), --countReadPairs, -B
    (require_both_ends_aligned) and -C (exclude_chimeric_fragments). Neither side passes -M
    (so multi-mapping reads are excluded on both) nor -Q/--minMQS (so both keep the featureCounts
    default MAPQ=0) nor --fraction. Both reject negative counts and match BAM columns by basename.
    Best practice for a gene-level DESeq2 workflow is exactly this: uniquely-mapped reads only,
    no fractional counting. The cape_thoracic_duct counts_equivalence.json shows 56748/56748 genes
    identical for all six samples (max abs diff 0), confirming the counting layer is faithful.
  reference:
