- id: A1-007
  track: A
  area: de
  verdict: OK
  severity: S1
  summary: Contrast direction is derived explicitly from numerator/denominator on both sides; positive = up in numerator
  detail: >
    The sacred contrast rule holds. Both sides read factor/numerator/denominator from
    contrasts.tsv, relevel the factor with ref=denominator, resolve the coefficient by the exact
    pattern ^<factor>_<numerator>_vs_<denominator>$, and extract results for that named coefficient
    - so a positive log2FoldChange is up in the numerator by construction, never inferred from
    column order or group names. FRAME further labels the volcano x-axis "<numerator> - <denominator>"
    and classes up/down as up_in_numerator/down_in_numerator. Direction is verified numerically:
    de_equivalence.json decision_comparison reports 0 mismatched genes at FDR 0.05 / |LFC| 1.0,
    which cannot happen if the sign convention differed.
  reference:
    - {file: workflow/stages/core/deseq2.R, line: 26}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/de.R, line: 35}
