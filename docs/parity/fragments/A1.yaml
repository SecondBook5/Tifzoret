  summary: DESeq2 core (design, parametric fit, betaPrior=FALSE, independent filtering, BH) is equivalent; numerics within tol
  detail: >
    Both build DESeqDataSetFromMatrix on the same design formula, run DESeq with the default
    parametric fitType and the default betaPrior=FALSE (required for coef-based apeglm), then call
