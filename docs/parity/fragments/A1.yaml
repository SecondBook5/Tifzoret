- id: A1-005
  track: A
  area: de
  verdict: BEST-PRACTICE
  severity: S1
  summary: FRAME survives a failed parametric dispersion fit that would crash REF, but its fallback uses un-shrunk gene-wise dispersions
  detail: >
    REF runs DESeq(dds) with no error handling, so the DESeq2 parametric-fit error ("all gene-wise
    dispersion estimates are within 2 orders of magnitude from the minimum, returning the gene-wise
    estimates") aborts the whole run - a real risk for small-n or low-dispersion-spread cohorts
    that the cape numbers never exercise. FRAME de.R wraps DESeq in tryCatch and, on that specific
    message, falls back to estimateSizeFactors -> estimateDispersionsGeneEst -> assign dispGeneEst
    -> nbinomWaldTest. This graceful degradation is an improvement over REF crashing. However the
    fallback substitutes raw gene-wise MLE dispersions, skipping DESeq2's empirical-Bayes MAP
    shrinkage toward a trend; that inflates per-gene dispersion variance (especially for low-count
    genes) and is exactly what the DESeq2 docs advise against. Best practice for a failed
    parametric fit is fitType="local" (or "mean"), not bare gene-wise estimates. Flag: adopt a
    local/mean-fit fallback rather than raw dispGeneEst. When this path triggers FRAME also swaps
    VST for normTransform, so downstream heatmap/PCA change too.
  reference:
    - {file: workflow/stages/core/deseq2.R, line: 29}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/de.R, line: 40}
  evidence: code-only
  target: stats
  status: open
  commit: null

