- id: A1-008
  track: A
  area: de
  verdict: OK
  severity: S2
  summary: Significance classification uses raw padj plus shrunken |LFC| on both sides; NA-guarded
  detail: >
    FRAME de.R classifies direction with adjusted_p_value < fdr AND shrunken log2_fold_change
    (>= abs_log2fc up / <= -abs_log2fc down), all guarded by !is.na(adjusted_p_value). REF's
    build_plotting_table (de_tables.R) does the same: padj < fdr on the raw padj combined with
    log2FoldChange_display = coalesce(shrunken, raw), again NA-guarded. So both call significance
    on the raw adjusted p-value but threshold effect size on the shrunken LFC - matching policy,
    matching decisions (0 decision mismatches in evidence). Only nuance: FRAME's single-table
    ordering tie-breaks by desc(abs(shrunken LFC)) whereas REF orders each table by its own LFC;
    this only reorders exact padj ties and is cosmetic.
