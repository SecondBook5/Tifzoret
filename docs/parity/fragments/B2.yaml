  area: Set2-A PCA group ellipses
  verdict: FIDELITY-GAP
  severity: S3
  summary: REF draws minimum-enclosing group boundaries; FRAME draws covariance ellipses, so Panel A envelopes look different.
  detail: 'REF make_pca_plot builds a custom minimum-enclosing dashed oval per group (enclosing_ellipse: axis-aligned, padded to guarantee containment) and the gold Panel A subtitle reads "Dashed ovals denote minimum-enclosing group boundaries". FRAME uses ellipse_coordinates (utils.R), a covariance ellipse oriented by eigen(cov) with a chi-square radius (level 0.80) additionally expanded to contain all points (observed_radius*1.08) and a stabilized minor axis for 3-point groups; its subtitle reads "Ellipses summarize within-group covariance". Both are containment envelopes for n=3 groups but render as visibly different shapes/orientation. FRAME''s covariance-oriented ellipse is arguably the more standard statistical object; this is a presentation-fidelity divergence, not a numeric error.

