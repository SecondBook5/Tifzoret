- id: B2-010
  track: B
  area: Set2-C volcano label selection
  verdict: FIDELITY-GAP
  severity: S3
  summary: FRAME labels the global top-N by adjusted p; REF uses a tiered priority / balanced up-down / other-FDR / fallback selector.
  detail: 'REF select_volcano_label_table (de_labels.R) fills labels in tiers - study-named priority genes first (only if FDR-significant), then a balanced strict up/down split, then other FDR-significant genes, then strongest overall - deduplicating on plot_label and preferring rows with real symbols, with a fixed seed. FRAME simply filters direction != not_significant, arranges by adjusted_p_value then desc(abs(log2FC)), and takes slice_head(top_labels): no priority-gene promotion, no guaranteed up/down balance, and no symbol-dedup tiering. FRAME can therefore omit hypothesis-relevant callouts (e.g. mechanism genes) and skew all labels to one direction.

