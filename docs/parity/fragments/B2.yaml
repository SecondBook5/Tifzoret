- id: B2-001
  track: B
  area: Set2-A PCA variance-explained
  verdict: OK
  severity: S5
  summary: PCA axis labels report PC1/PC2 percent variance from the same prcomp decomposition on VST.
  detail: 'REF reads precomputed pca_variance_explained.tsv and labels axes "PC1 (%.1f%% variance)"/"PC2 (%.1f%% variance)" via make_pca_plot. FRAME runs stats::prcomp(t(vst), center=TRUE, scale.=FALSE) in qc.R, computes variance = 100 * sdev^2 / sum(sdev^2), and labels "PC1 (%.1f%%)"/"PC2 (%.1f%%)". Same underlying VST-space eigen-decomposition and same rounding; only the word "variance" in the axis title differs. Statistically equivalent.

