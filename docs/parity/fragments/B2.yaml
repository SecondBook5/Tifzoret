- id: B2-003
  track: B
  area: Set2-A PCA aspect ratio
  verdict: REGRESSION
  severity: S3
  summary: FRAME PCA omits coord_equal, so PC1/PC2 are not drawn on a common scale and group separation is visually distorted.
  detail: 'REF make_pca_plot ends with coord_equal(clip="off"), which is best practice for PCA: PC1 and PC2 are in the same units (VST-scale distances) and must share an aspect ratio or the relative separation is misrepresented. FRAME''s qc.R pca_plot has no coord_equal/coord_fixed, so the panel is stretched to the default device aspect and the 58.7%/14.1% variance split is not honestly conveyed. FRAME diverges from REF in a worse way for the exact same data.

