  summary: FRAME's ORA background is every gene with a symbol (including NA-padj / independent-filtered rows); REF restricts to genes with finite stat, padj and log2FC
  detail: >
    REF builds the ORA background universe as genes with a non-blank symbol AND a finite Wald
    statistic AND finite adjusted p-value AND finite log2 fold change -- i.e. genes actually
    carried through DE with valid statistics. FRAME defines the universe as
    unique(de$gene_symbol) filtered only for non-empty symbol, so genes with NA padj (dropped by
