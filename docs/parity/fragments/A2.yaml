- id: A2-003
  track: A
  area: pathways/fgsea-eps-nperm
  verdict: BEST-PRACTICE
  severity: S3
  summary: FRAME sets fgsea eps=0 (exact small p-values) vs REF's default eps=1e-10; neither overrides nPermSimple
  detail: >
    FRAME calls fgseaMultilevel with eps=0, which removes the lower bound on estimated p-values
    and lets the multilevel algorithm compute arbitrarily small tail probabilities; this is the
    fgsea-authors' recommended setting for precise small p-values. REF passes no eps, inheriting
    the package default eps=1e-10, so REF floors very significant pathways at ~1e-10 (its
    gseGO/gseKEGG calls likewise pin eps=1e-10). This is a numeric divergence at the extreme
    tail (affects padj of the most significant terms and, rarely, ordering) but FRAME's choice
    is the more accurate one, so it is flagged as an improvement rather than a regression.
    Neither side sets nPermSimple, so both use the default (1000) initial simple permutations;
    that dimension is at parity.
