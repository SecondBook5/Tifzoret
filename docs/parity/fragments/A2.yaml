- id: A2-001
  track: A
  area: pathways/fgsea-ranking-metric
  verdict: OK
  severity: S3
  summary: Both rank preranked GSEA by the signed DESeq2 Wald statistic, collapsing duplicate symbols to the largest absolute value
  detail: >
    REF builds the ranking vector from the resolved `stat` column (DESeq2 Wald statistic),
    filters missing/non-finite values, collapses duplicate gene symbols by keeping the row
    with the largest absolute statistic (tie-break: larger raw stat, then symbol), then sorts
    decreasing. FRAME does the equivalent: it filters `statistic` (raw$stat from
    DESeq2::results, the unshrunk Wald statistic), arranges by desc(abs(statistic)), keeps the
    first row per gene_symbol (largest abs), then sorts decreasing. Metric and collapse rule
    match. Note FRAME's log2FoldChange is apeglm-shrunk but the ranking uses the unshrunk Wald
    stat, matching REF. Minor divergence: FRAME's duplicate-collapse tie-break among equal
    |stat| is only desc(abs()) (order otherwise input-dependent) whereas REF adds -stat then
    symbol; negligible in practice.
