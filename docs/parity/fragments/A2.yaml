- id: A2-020
  track: A
  area: pathways/gsea-enrichment-curve
  verdict: OK
  severity: S4
  summary: FRAME recomputes its own weighted running-enrichment curve for display while taking leading-edge membership from fgsea; consistent with REF's classic curve
  detail: >
    FRAME's running_enrichment() rebuilds the enrichment curve for the plotted pathways using the
    classic weighted Kolmogorov-Smirnov walk (hit increments proportional to abs(rank) over the
    sum of hit weights, miss increments -1/n_misses), which corresponds to the fgsea default
    gseaParam = 1; leading-edge membership on the curve is read back from fgsea's leadingEdge
    column, not recomputed. REF renders classic fgsea enrichment plots from the fgsea object
    directly. The two curves should agree up to tie ordering; the residual risk is the same tie
    non-determinism flagged in A2-002. This is display-layer parity with no independent
    statistical claim, hence OK.
