- id: A2-002
  track: A
  area: pathways/fgsea-ties
  verdict: REGRESSION
  severity: S2
  summary: FRAME passes tied ranks to fgsea with no tie-breaking and suppresses the warning; REF applies deterministic tie-breaking (an explicit audit fix)
  detail: >
    REF wraps every fgseaMultilevel call with make_fgsea_ranking_vector_tie_safe(), which
    applies a tiny deterministic offset within each tied-statistic group (scaled to a fraction
    of the smallest true gap) so tied genes get a stable, reproducible order before enrichment
    scoring; the REF comment marks this as an audit HIGH finding. FRAME does no tie-breaking:
    it sorts the raw Wald statistics decreasing and calls fgseaMultilevel inside
    suppressWarnings(), silencing fgsea's own tie warning. With many genes sharing identical
    Wald statistics (common for low-count genes), the order among ties -- and thus the enrichment
    score at tie boundaries and the leading-edge membership -- can differ across fgsea versions
    and platforms. Best practice is REF's deterministic resolution. FRAME regresses on
    reproducibility of published GSEA results.
  reference:
