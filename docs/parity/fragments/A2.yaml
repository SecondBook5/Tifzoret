- id: A2-004
  track: A
  area: pathways/seed-determinism
  verdict: REGRESSION
  severity: S3
  summary: FRAME seeds once at script top from a config key; REF hard-codes seed=1L and re-seeds immediately before every stochastic call
  detail: >
    fgsea (multilevel) is stochastic. REF defaults seed=1L in code, threads it through the
    stage, and calls set.seed(seed) immediately before each fgseaMultilevel / gseGO / gseKEGG /
    GSVA invocation (explicit audit HIGH reproducibility fix), so each stochastic step is
    independently reproducible. FRAME calls set.seed(cfg$figures$pathways$seed) once at the top
    of pathways.R (default seed is 1 in all project templates, matching REF) and runs
    fgseaMultilevel with BiocParallel::SerialParam(); with no RNG consumed between the seed and
    the call, the current code path is deterministic. Two concerns: (1) reproducibility depends
    on the single top-level seed and on no future reordering introducing RNG before fgsea, which
    is more fragile than REF's per-call seeding; (2) if figures.pathways.seed is absent from a
    user config, set.seed(NULL) leaves the RNG unseeded and fgsea becomes non-deterministic,
    whereas REF's hard-coded default always seeds. Recommend a per-call seed plus a default when
    the key is missing.
