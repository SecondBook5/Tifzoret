  verdict: FIDELITY-GAP
  severity: S5
  summary: Frame lacks REF's defaults inheritance mechanism
  detail: 'REF configs declare `defaults: config/defaults.yaml` (e.g., ligation_vs_sham/config.yaml:2) and provide configmerge.py with deep-merge logic (workflow/lib/configmerge.py:14-25). However, per the audit comment in configmerge.py:3-8, the reference Snakefile never actually loaded or merged defaults, so all settings were duplicated inline. FRAME has no defaults mechanism—no schema field for a defaults reference, no merge logic in config.py. While this matches REF''s actual behavior (not its declared intent), it means frame cannot support cohort configs that genuinely inherit shared settings. Generality impact: no DRY mechanism for multi-cohort projects with shared parameters (e.g., reference genome, counting options, pathway collections).

