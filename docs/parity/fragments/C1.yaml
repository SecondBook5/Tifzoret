  summary: Frame rejects REF configs with missing version field; migrate-config exists but doesn't handle this case
  detail: 'REF configs have no `version` field (config.schema.yaml has no version property), but FRAME requires `version: const: 2` (project.schema.yaml:15-16). When normalize_config encounters version=None, it raises "unsupported project configuration version: None" (config.py:97) instead of attempting migration. The CLI provides `migrate-config` (cli.py:174-202) but it only handles v1→v2 migration (config.py:43-87), not no-version→v2. This means REF configs cannot run without manual rewriting, blocking 3/4 published studies. Generality blocker: frame cannot ingest its own reference cohorts'' configuration format.

