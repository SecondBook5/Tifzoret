- id: C1-012
  track: C
  area: config-generality
  verdict: FIDELITY-GAP
  severity: S4
  summary: Frame config structure differs fundamentally from REF, requiring manual translation per cohort
  detail: 'REF configs have flat top-level structure: study, samples, contrasts, hypotheses, source, reference, counting, qc, de, pathways, reporting, publication (config.schema.yaml:3-67). FRAME nests differently: project, species, reference, inputs (with discriminated union), analysis (containing design, contrasts, profile, modules, settings), resources, hypotheses, publication, figures, output (project.schema.yaml:4-213). Field mappings are non-obvious: REF `study.id` → FRAME `project.id`; REF top-level `contrasts` → FRAME `analysis.contrasts`; REF `source` → FRAME `inputs`; REF `hypotheses` → FRAME `hypotheses.claims`; REF `publication.hypothesis_panels` → FRAME `hypotheses.panels`. No automated mapping exists beyond v1→v2 migration (which itself doesn''t handle REF structure). Generality impact: each REF cohort requires manual config rewriting to run on FRAME.

