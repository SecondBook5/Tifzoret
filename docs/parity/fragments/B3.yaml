- id: B3-017
  track: B
  area: Set2-I consolidated violins (significance test)
  verdict: REGRESSION
  severity: S1
  summary: REF annotates brackets with the modeled DESeq2 DE FDR; FRAME recomputes a Wilcoxon test on VST expression that cannot reach the significance the panel shows at n=3/group
  detail: 'REF make_violin_block draws significance brackets straight from the gene panel summary''s DESeq2 adjusted p-value (padj / log2FoldChange_display), i.e. the modeled differential result, and only for genes with padj<0.05, with ***/**/* by padj thresholds - matching the gold panel-I brackets and its subtitle "brackets denote DE FDR". FRAME publication.R instead recomputes significance with wilcox.test(numerator vs denominator) on the VST values, BH-adjusted across the displayed genes (publication.R:173-176). With n=3 per group a two-sided Wilcoxon rank-sum has a minimum attainable p around 0.1 (exact) / ~0.08 (normal approximation), so FRAME can essentially never produce the *, ** or *** brackets in the published figure and will label nearly every gene "ns". This both diverges from REF and is a statistically inappropriate, underpowered test that discards the properly modeled DE result - a statistical-correctness regression.

    '
