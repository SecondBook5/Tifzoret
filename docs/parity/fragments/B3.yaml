- id: B3-005
  track: B
  area: Set2-F Hallmark GSVA (scoring method)
  verdict: REGRESSION
  severity: S2
  summary: FRAME scores pathways with ssGSEA (ssgseaParam) whereas REF's panel is labelled and computed as classic GSVA
  detail: 'The gold panel is titled "Hallmark GSVA activity" and REF reads precomputed GSVA scores (dat$gsva) produced by the classic GSVA algorithm. FRAME pathways.R computes scores with GSVA::ssgseaParam (single-sample GSEA), a different enrichment estimator with different per-sample score distributions and normalization (normalize=TRUE). The two methods are not numerically equivalent, so FRAME''s sample scores (and therefore the row z-scores and limma differential used for selection) diverge from the published GSVA values. If the intended parity target is GSVA, FRAME should offer gsvaParam; otherwise the panel/axis label is misleading. (REF''s exact upstream param is not visible in these files, so this is flagged as a method divergence rather than a confirmed value mismatch.)

