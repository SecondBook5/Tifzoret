- id: B3-001
  track: B
  area: Set2-E GO BP ORA (FDR family)
  verdict: REGRESSION
  severity: S2
  summary: FRAME BH-adjusts ORA p-values across all pooled collections and both directions, unlike REF's per-ontology enrichGO
  detail: 'REF panel E comes from clusterProfiler enrichGO run separately on the up and down gene lists (dat$ora_up / dat$ora_down), so displayed FDR values are BH-corrected within the GO Biological Process family only. FRAME computes ORA with a single custom hypergeometric pass (run_ora) over the union of ALL measured gene sets in the GMT (GO + KEGG + Hallmark + configured programs), then applies one p.adjust(method="BH") over the entire bound up+down ora_table (pathways.R:228). ontology.R later filters that pooled result down to GO BP for display and re-selects terms by the pooled adjusted_p_value (ontology.R:33-38). The result is that the -log10(FDR) color and the top-term selection reflect a much larger, heterogeneous multiple-testing family than REF''s, changing both the shown FDR magnitudes and potentially which 8 terms appear per direction. This is a numeric-parity divergence in a displayed statistic; best practice is to correct within a coherent gene-set family (as REF does).

    '
