- id: A4-005
  track: A
  area: composition (differential direction / contrast semantics)
  verdict: OK
  severity: S2
  summary: FRAME cell-state effect direction is read from the contrast (numerator-denominator), matching REF's oriented logFC
  detail: >
    REF releases the group factor to denominator/reference-first from the resolved contrast,
    fits limma on the ssGSEA scores, then orients logFC via orient_sign() so positive means
    "up in the numerator" and labels higher_in accordingly (deconvolution_signatures.R:166-195).
    FRAME relevels the design factor with ref=denominator (composition.R:48), selects the
    contrast_group<numerator> coefficient (composition.R:51), so topTable's logFC is directly
    numerator-vs-denominator, and sets higher_in = ifelse(logFC>=0, numerator, denominator)
    (composition.R:62). Direction is derived from the contrast file on both sides, never from
    group-name/appearance order. FRAME's grep-for-numerator-coefficient approach also generalizes
    to covariate-adjusted / multi-level designs, whereas REF composition requires exactly one
    condition coefficient. Contrast semantics preserved; verdict OK.
  reference:
    - {file: workflow/stages/composition/deconvolution_signatures.R, line: 188}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/composition.R, line: 48}
  evidence: code-only
  target: stats
  status: open
  commit: null

- id: A4-006
  track: A
  area: hypothesis (pathway/reference direction)
  verdict: BEST-PRACTICE
  severity: S1
  summary: REF hypothesis pathway/reference stats infer treatment-vs-control from sample-sheet appearance order, ignoring the contrast; FRAME consumes contrast-oriented effects
  detail: >
    REF's hypothesis stage sets condition levels by appearance order
    (factor(condition, levels=unique(condition)), hypothesis_io.R:181) and never receives a
    contrasts.tsv (parse_hypothesis_args has no --contrasts). compute_pathway_panel_statistics
    then takes condition_levels[[1]] as control and [[2]] as treatment and reports
    mean_difference_treatment_minus_control / Wilcoxon (hypothesis_gene_panels.R:369,376-405);
    prepare_reference_gene_set_assessment does the same (hypothesis_gene_panels.R:488-519).
    Direction is therefore determined by row order in the sample CSV, not the study contrast's
    numerator-denominator, so the reported difference can be inverted relative to the contrast.
    Per the sacred contrast rule this is at least S1. FRAME's hypotheses.py never re-derives
    direction from group order: pathway effect is the NES from fgsea (falling back to the GSVA
    differential logFC), both oriented numerator-denominator upstream (hypotheses.py:104-113).
    BEST-PRACTICE: the flaw is REF's; FRAME correctly avoids it and must not "match" it.
  reference:
    - {file: workflow/stages/hypothesis/hypothesis_gene_panels.R, line: 376}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/hypotheses.py, line: 104}
  evidence: code-only
  target: stats
  status: open
  commit: null

- id: A4-007
  track: A
  area: hypothesis (evidence spine wiring)
  verdict: BEST-PRACTICE
  severity: S3
  summary: REF's evidence spine (lib/evidence.R) is unused test-only code; FRAME's hypotheses.py is the actual per-hypothesis evidence table
  detail: >
    REF's lib/evidence.R defines an evidence-record schema and a collate/aggregate API and
    documents the intended philosophy - "PRESENTS evidence; does NOT render a
    supported/contradicts verdict, the reader judges" (evidence.R:6-9). A repo-wide search shows
    it is referenced only by tests/r/test_evidence.R and never sourced by any stage/Snakefile,
    so REF never emits a predicted-vs-observed hypothesis table at run time. FRAME's hypotheses.py
    is the operative implementation: it collates gene/pathway/regulator evidence per configured
    claim into hypothesis_evidence.tsv and hypothesis_summary.tsv (hypotheses.py:82-140). Unlike
    the REF intent, FRAME does assign a per-line support label (supporting/conflicting/neutral/
    not_directional/unmeasured, hypotheses.py:47-59) and tallies supporting/conflicting counts,
    but it stops short of an overall verdict and carries a non-causal caveat (hypotheses.py:141,144).
    BEST-PRACTICE: FRAME operationalizes a spine REF left as dead code; the light per-line verdict
    is acceptable given the caveat but should stay descriptive.
  reference:
    - {file: workflow/lib/evidence.R, line: 6}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/hypotheses.py, line: 82}
  evidence: code-only
  target: stats
  status: open
  commit: null

- id: A4-008
  track: A
  area: hypothesis (evidence aggregation granularity)
  verdict: BEST-PRACTICE
  severity: S4
  summary: FRAME tallies evidence per individual gene rather than collapsing panels to one direction, biasing supporting/conflicting counts toward large gene panels
  detail: >
    REF's (unused) evidence.R aggregate_panel_direction collapses a panel to a single evidence
    line using the median signed effect and the best (min) padj across members
    (evidence.R:54-64). FRAME instead emits one evidence row per gene per group per panel
    (hypotheses.py:84-96) and then counts supporting/conflicting across all rows
    (hypotheses.py:136-137). Consequently a large multi-gene panel contributes many rows and
    dominates a claim's tally, while a single pathway or regulator contributes one row - the
    supporting/conflicting summary is weighted by panel size and mixes gene-level with
    pathway/regulator-level granularity. Additionally the "significant" count applies the DE FDR
    threshold (figures.de.fdr) uniformly to pathway padj and regulator adj.P.Val
    (hypotheses.py:135). Neither is wrong per se, but a panel-level direction collapse (as REF's
    spine intended) would give a less size-biased summary. BEST-PRACTICE, S4, routed to stats.
  reference:
    - {file: workflow/lib/evidence.R, line: 54}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/hypotheses.py, line: 84}
  evidence: code-only
  target: stats
  status: open
  commit: null

- id: A4-009
  track: A
  area: hypothesis (expected_direction schema vs support() parsing)
  verdict: BEST-PRACTICE
  severity: S4
  summary: hypotheses.schema leaves expected_direction free text while support() matches a fixed token vocabulary, so synonyms silently degrade to not_directional
  detail: >
    hypotheses.schema.yaml types expected_direction as an arbitrary non-empty string
    (hypotheses.schema.yaml:18), but hypotheses.py support() only recognizes fixed substrings -
    positive {increase,higher,up,activation,adaptation}, negative {decrease,lower,down,repression,
    loss}, and {context,mixed,configured}->not_directional (hypotheses.py:47-59). A claim written
    with a synonym the tokenizer does not know (e.g. "elevated", "reduced", "gain", "suppressed",
    "induced") silently falls through to not_directional and is never scored for support - a
    quiet correctness hazard. The panel schema, by contrast, constrains expected_direction to an
    enum [increased,decreased,mixed,context_dependent,not_specified] (hypothesis_panels.schema.yaml:23,63),
    so the two schemas are inconsistent (and note "not_specified" is not in the token list either).
    Best practice is an enum on the hypotheses schema plus explicit mapping. BEST-PRACTICE, S4,
    routed to stats.
  reference:
    - {file: workflow/lib/evidence.R, line: 33}
  frame:
    - {file: src/bulk_rna_frame/schemas/hypotheses.schema.yaml, line: 18}
  evidence: code-only
  target: stats
  status: open
  commit: null

