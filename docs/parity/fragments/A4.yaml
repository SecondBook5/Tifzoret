- id: A4-001
  track: A
  area: composition (cell-state fractions claim)
  verdict: OK
  severity: S1
  summary: Cell-state outputs are labeled relative signature/composition scores and never imply estimated cell fractions
  detail: >
    README (line 19) claims "Cell-state results are relative signature/composition scores,
    not estimated cell fractions." FRAME honors this everywhere the cell-state stage speaks:
    the plot subtitle reads "Relative signature scores; positive effects are higher in the
    contrast numerator" (composition.R:78), the plot title is "Cell-state signature shifts"
    and the x axis is "Signature score log2 fold-change" (never a fraction/percent), and
    composition_summary.json emits an explicit warning that outputs "must not be interpreted
    as cell fractions" (composition.R:85). docs/methods.md:9 repeats the framing. REF likewise
    scores ssGSEA signatures rather than estimating fractions (score_method = "ssgsea",
    deconvolution_signatures.R:198). No output, label, axis, or table on the FRAME side implies
    cell fractions. Claim verified; verdict OK at S1 because a fractions claim would be S1.
  reference:
    - {file: workflow/stages/composition/deconvolution_signatures.R, line: 198}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/composition.R, line: 85}
  evidence: code-only
  target: stats
  status: open
  commit: null

- id: A4-002
  track: A
  area: composition (scoring method)
  verdict: OK
  severity: S2
  summary: Both pipelines score signatures with ssGSEA via GSVA::ssgseaParam(normalize=TRUE)
  detail: >
    REF scores cell-state signatures with GSVA's ssGSEA backend using ssgseaParam(minSize=1,
    maxSize=max(lengths), normalize=TRUE) with an old-API fallback (deconvolution_signatures.R:87-114),
    reporting score_method="ssgsea". FRAME uses the same method: GSVA::ssgseaParam(exprData=expression,
    geneSets=gene_sets, minSize=min_genes, maxSize=Inf, normalize=TRUE) then GSVA::gsva(...,
    BPPARAM=SerialParam()) (composition.R:43-44). Method (ssGSEA), normalization, and the
    subsequent limma lmFit/eBayes differential model are equivalent; FRAME additionally pins
    SerialParam for reproducibility. Parameter nuances (minSize, maxSize) are captured in A4-003.
  reference:
    - {file: workflow/stages/composition/deconvolution_signatures.R, line: 87}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/composition.R, line: 43}
