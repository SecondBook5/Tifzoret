- id: A4-003
  track: A
  area: composition (signature coverage filtering)
  verdict: FIDELITY-GAP
  severity: S4
  summary: FRAME drops REF's upper-bound (max_genes) gate on signature size before scoring
  detail: >
    REF retains a signature for scoring only when min_genes <= matched <= max_genes (default
    3..200), via retained_for_scoring (deconvolution_signatures.R:52,56). FRAME filters only on
    the lower bound (lengths(gene_sets) >= min_genes, composition.R:40) and passes maxSize=Inf,
    so an oversized signature is never excluded. For the curated lymphatic signatures (all <20
    genes) this is inert, but it is a genuine loss of the size-sanity gate and would let an
    accidentally huge signature dominate ssGSEA scoring in a new cohort. Best practice keeps an
    explicit upper bound. FIDELITY-GAP, S4 (cohort-generality), routed to stats.
  reference:
    - {file: workflow/stages/composition/deconvolution_signatures.R, line: 52}
  frame:
    - {file: src/bulk_rna_frame/workflow/scripts/composition.R, line: 40}
  evidence: code-only
  target: stats
  status: open
  commit: null

