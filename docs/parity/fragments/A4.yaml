- id: A4-012
  track: A
  area: composition (signature provenance)
  verdict: OK
  severity: S5
  summary: FRAME separates a neutral signature schema from consumer-owned signature content, unlike REF's baked-in lymphatic signatures
  detail: >
    REF ships the curated lymphatic/immune signature content directly in
    config/deconvolution_signatures.yaml (11 named signatures with gene lists and categories,
    deconvolution_signatures.yaml:1-37). FRAME instead defines a neutral signatures.schema.yaml
    (id, label, category, genes; genes minItems 2) and keeps the actual curated signatures
    consumer-owned, referenced by the project config (signatures.schema.yaml:1-23; documented in
    docs/full-migration-map.md:214). This is the intended provenance separation and an
    improvement for reuse; the only minor delta is that FRAME requires an explicit label per
    signature whereas REF derived a label from the id via gsub("_"," ")
    (deconvolution_signatures.R:72). Verdict OK, S5.
  reference:
