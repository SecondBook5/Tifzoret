  summary: Panels without color annotations are handled gracefully; color is optional and never required for hypothesis evidence or cell-state direction
  detail: >
    Per the focus note on frame commit 6e5dac1 ("support publication panels without color
    annotations"), color is optional in hypothesis_panels.schema.yaml for programs, gene_panels,
    and pathway_panels (hypothesis_panels.schema.yaml:17,34,51), matching REF where gene panels
