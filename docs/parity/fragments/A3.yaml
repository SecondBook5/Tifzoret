  summary: FRAME degrades to a labeled weighted-target score if decoupleR/VIPER is unavailable; REF hard-fails
  detail: >
    REF viper.R/viper_dorothea.R stop() if the viper package is missing. FRAME regulators.R
    wraps decoupleR::run_viper in tryCatch and, on ImportError or execution failure, falls
