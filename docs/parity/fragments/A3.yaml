- id: A3-009
  track: A
  area: networks (STRING induced-network batching, commit 4546a17)
  verdict: OK
  severity: S4
  summary: Batching covers all identifier pairs, adds no external nodes, and dedups by max score -- algorithmically correct
  detail: >
    Commit 4546a17 added fetch_induced_network(), which chunks unique mapped STRING ids
    into batches of 900 and issues a request for every chunk pair (i, j>=i): within-chunk
    requests submit one chunk, cross-chunk requests submit the concatenation. Every gene
    pair therefore co-occurs in at least one request, edges are keyed by sorted
    (A,B) and the max-score row is retained, and network_type="functional" with no
    add_nodes means STRING never introduces genes outside the submitted set (the docstring
    claim holds). The algorithm is correct for completeness and determinism. Verdict OK.
    Caveat (see A3-010 target note): cross-chunk payloads are 2*900=1800 identifiers,
    which still approaches STRING's practical request cap; REF sidesteps this entirely by
    capping seeds at max_nodes (50) before fetching. A smaller batch_size (cap/2) would
    be safer but is not incorrect at present.
  reference:
    - {file: workflow/stages/ontology/ontology_string.R, line: 109}
    - {file: workflow/stages/ontology/ontology_string.R, line: 193}
