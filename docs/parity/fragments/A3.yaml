- id: A3-005
  track: A
  area: regulators (VIPER aREA signature scaling)
  verdict: REGRESSION
  severity: S2
  summary: REF applies viper(method="scale") gene-wise signature scaling; FRAME feeds raw VST to decoupleR::run_viper
  detail: >
    Both sides use the aREA algorithm, but the per-sample signature differs. REF calls
    viper::viper(symbol_matrix, regulons, method = "scale", minsize = min_genes,
    eset.filter = FALSE), so each gene is scaled across samples before aREA. FRAME calls
    decoupleR::run_viper(mat = expression, ..., eset.filter = FALSE, pleiotropy = TRUE)
    on the raw VST matrix with no explicit signature-scaling method, so unless
    decoupleR internally reproduces the "scale" transform the resulting NES/activity are
    not numerically comparable to REF. This is a numeric-parity risk that a run pass
    should confirm; flagged REGRESSION S2 because FRAME diverges from REF's explicit,
    documented scaling and the burden is on FRAME to prove equivalence.
