- id: A3-002
  track: A
  area: regulators (DoRothEA confidence-tier likelihood weighting)
  verdict: FIDELITY-GAP
  severity: S2
  summary: FRAME uses uniform VIPER likelihood=1 for DoRothEA edges; REF weights by confidence tier
  detail: >
    REF regulators_prior.R defines DOROTHEA_CONFIDENCE_LIKELIHOOD = c(A=1.0, B=0.75,
    C=0.5, D=0.25, E=0.1) and sets each edge's VIPER likelihood from its confidence
    tier, so higher-confidence targets contribute more to aREA. The dorothea_mm/hs
    tables have no likelihood column, so FRAME regulators.R hits the fallback and sets
    likelihood = 1 for every edge, then passes .likelihood = "likelihood" into
    decoupleR::run_viper. Result: FRAME weights all A/B/C edges equally. Uniform
    likelihood=1 is the standard dorothea/VIPER default (so FRAME is defensible), but
    it does not reproduce REF's confidence-weighted regulon and will produce different
    NES/activity values. FIDELITY-GAP (missing REF's tiered weighting), S2 numeric parity.
  reference:
