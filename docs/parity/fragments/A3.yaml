  verdict: FIDELITY-GAP
  severity: S3
  summary: FRAME's unsigned program score is a plain weighted mean, not the ssGSEA/VIPER REF uses for unsigned sets
  detail: >
    REF scores unsigned target sets with real enrichment methods -- ssGSEA (canonical
    stage) and unsigned VIPER (viper.R). FRAME writes two matrices: signed activity from
    VIPER (dorothea_activity_scores.tsv) and an unsigned regulator_target_program_scores.tsv
    that is always produced by signed_fallback() -- a colSums weighted-mean of target VST,
    not an enrichment statistic -- and only the signed VIPER matrix feeds the limma
