- id: A5-002
  track: A
  area: sva
  verdict: BEST-PRACTICE
  severity: S2
  summary: num.sv(method="be") is permutation-based but no set.seed is set, so n.sv (and the whole SV-adjusted DE) is nondeterministic.
  detail: 'sva::num.sv with method="be" (Buja-Eyuboglu) draws B=20 random permutations with seed=NULL by default, so the estimated number of surrogate variables can differ run-to-run. Because n_sv drives whether and how many SVs are added to the DESeq2 design, the entire SV-adjusted sensitivity result is nonreproducible. FRAME sets a seed in mediation.R (from cfg$analysis$random_seed) and for the multilayer layout, but sva.R sets none before num.sv. Best practice for a reproducibility-focused pipeline that records seeds in its manifest is to set.seed(cfg$analysis$random_seed) before num.sv (or pass seed= to num.sv). Trivial one-line fix; recorded as inline candidate.

    '
