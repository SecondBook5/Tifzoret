- id: A5-009
  track: A
  area: power
  verdict: BEST-PRACTICE
  severity: S4
  summary: Power uses the observed standardized effect (post-hoc power), which is statistically circular; the script honestly flags it as exploratory/optimistic.
  detail: 'power.py computes Cohen''s d from the observed group means and pooled SD (denominator N-2, correct two-group pooling) then n_per_group = ceil(2*((z_0.975 + z_0.8)/d)^2), the standard two-sample normal-approximation formula (z=1.96/0.84). Basing a power/sample-size estimate on the observed effect is post-hoc power, widely criticized as circular and optimistic. FRAME acknowledges this in the summary warning ("exploratory and can be optimistic in small samples") and labels the method a "normal-approximation planning estimate", and it guards empty groups (all(groups.values())) and zero variance. Deterministic. No reference stage; the honest labeling keeps this at best-practice rather than a defect.

    '
