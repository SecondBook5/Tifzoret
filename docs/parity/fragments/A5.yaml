- id: A5-014
  track: A
  area: shared-libs/io
  verdict: REGRESSION
  severity: S4
  summary: FRAME's read_counts_contract lacks the 2^31 overflow guard REF's io.R added, allowing silent NA coercion of counts beyond 32-bit range.
  detail: 'REF''s io.R read_counts explicitly refuses silent NA coercion - it errors when the matrix is all-NA or when max(count) >= 2^31-1 before storage.mode(mat) <- "integer" (an audit LOW finding it deliberately fixed). FRAME''s shared read_counts_contract in utils.R does storage.mode(mat) <- "integer" with no such guard, so a count >= 2^31 would silently become NA. config.py validates that counts parse as non-negative Python ints before the run, which closes the non-integer/negative path, but Python ints do not overflow, so an astronomically large per-gene count (>~2.1e9, practically impossible in bulk RNA-seq) would pass validation and then silently NA-coerce in qc.R/de.R. Real but very low-likelihood parity regression vs REF''s explicit guard; restoring the max-value check is a trivial defensive fix.

    '
  reference:
