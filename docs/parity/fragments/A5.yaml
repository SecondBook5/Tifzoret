- id: A5-008
  track: A
  area: mediation
  verdict: BEST-PRACTICE
  severity: S4
  summary: Mediator and outcome models omit the design covariates, weakening the no-unmeasured-confounding (sequential ignorability) assumption; assumption is not stated in machine output.
  detail: 'The mediator model (mediator ~ treatment) and outcome model (outcome ~ treatment + mediator) include only the treatment even when the study design formula carries adjustment covariates (e.g. batch). Causal mediation relies on sequential ignorability; best practice is to include the same covariates used in the DE design in both sub-models. FRAME''s causal caveat lives in docs (advanced_methods/methods), but the machine-readable summary warnings mention only small-sample exploratory status, not the confounding assumption. Also, multiple outcome pathways are collapsed to a single rowMeans composite outcome, a modeling simplification. Exploratory module, no reference counterpart; flagged as improvement.

