- id: A5-001
  track: A
  area: sva
  verdict: OK
  severity: S4
  summary: SVA estimates n.sv, then feeds surrogate variables back into the DESeq2 design and refits.
  detail: 'FRAME estimates the number of surrogate variables with sva::num.sv(vst, mod, method="be") on the variance-stabilized matrix, with mod = model.matrix(full design) and mod0 = the design minus the contrast factor (correct full/null split for SVA). When n_sv > 0 it runs sva(), appends SV1..SVn to colData, rebuilds the design as "~ <original formula> + SV1 + ... + SVn", refits DESeq2, and reports original vs SV-adjusted log2FC/padj for the exact contrast coefficient. The relevel(ref=denominator) done before model.matrix is preserved into the refit, and resultsNames is matched by an anchored numerator_vs_denominator pattern, so contrast semantics (numerator - denominator) are respected. There is no reference SVA stage; the nearest REF comparator is the limma sensitivity refit, which likewise adds covariates to a design and re-estimates. Surrogate variables are genuinely propagated into DE, so the mechanism is sound.

