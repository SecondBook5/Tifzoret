$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required:
  - version
  - project
  - species
  - reference
  - inputs
  - analysis
  - resources
  - figures
  - output
properties:
  version:
    const: 2
  project:
    type: object
    additionalProperties: false
    required: [id, title]
    properties:
      id: {type: string, pattern: "^[a-z0-9][a-z0-9_-]*$"}
      title: {type: string, minLength: 1}
      description: {type: string}
  species:
    type: object
    additionalProperties: false
    required: [provider, scientific_name]
    properties:
      provider: {enum: [mouse, human, custom]}
      scientific_name: {type: string, minLength: 1}
      taxonomy_id: {type: [integer, "null"], minimum: 1}
  reference:
    type: object
    additionalProperties: false
    required: [genome_build]
    properties:
      genome_build: {type: string, minLength: 1}
      annotation_release: {type: [string, integer, "null"]}
      expected_contigs: {type: [integer, "null"], minimum: 1}
  inputs:
    oneOf:
      - {$ref: "#/$defs/countInputs"}
      - {$ref: "#/$defs/bamInputs"}
      - {$ref: "#/$defs/nfcoreInputs"}
      - {$ref: "#/$defs/archiveInputs"}
  counting:
    $ref: "#/$defs/counting"
  analysis:
    type: object
    additionalProperties: false
    required: [design, contrasts, profile]
    properties:
      design: {type: string, pattern: "^~"}
      contrasts: {type: string, minLength: 1}
      profile: {enum: [standard, publication, full]}
      random_seed: {type: integer, minimum: 0}
      modules:
        type: object
        additionalProperties: false
        properties:
          qc: {type: boolean}
          de: {type: boolean}
          pathways: {type: boolean}
          ontology: {type: boolean}
          composition: {type: boolean}
          regulators: {type: boolean}
          networks: {type: boolean}
          hypotheses: {type: boolean}
          publication: {type: boolean}
          report: {type: boolean}
          sva: {type: boolean}
          wgcna: {type: boolean}
          mediation: {type: boolean}
          multilayer: {type: boolean}
      settings:
        type: object
        additionalProperties: false
        properties:
          composition:
            type: object
            additionalProperties: false
            properties:
              min_genes: {type: integer, minimum: 2}
          regulators:
            type: object
            additionalProperties: false
            properties:
              confidence: {type: array, uniqueItems: true, items: {enum: [A, B, C, D, E]}}
              min_targets: {type: integer, minimum: 2}
              top_regulators: {type: integer, minimum: 2}
          networks:
            type: object
            additionalProperties: false
            properties:
              required_score: {type: integer, minimum: 0, maximum: 1000}
              max_nodes: {type: integer, minimum: 10}
              seed: {type: integer, minimum: 0}
          sva:
            type: object
            additionalProperties: false
            properties:
              minimum_recommended_samples: {type: integer, minimum: 2}
          wgcna:
            type: object
            additionalProperties: false
            properties:
              top_variable_genes: {type: integer, minimum: 100}
              minimum_module_size: {type: integer, minimum: 5}
              minimum_recommended_samples: {type: integer, minimum: 2}
          mediation:
            type: object
            additionalProperties: false
            properties:
              mediator_pathway: {type: string, minLength: 1}
              outcome_pathways:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, minLength: 1}
              simulations: {type: integer, minimum: 100}
              minimum_recommended_samples: {type: integer, minimum: 2}
  resources:
    type: object
    additionalProperties: false
    required: [gene_sets]
    properties:
      cache: {type: string, minLength: 1}
      offline: {type: boolean}
      refresh: {type: boolean}
      gene_sets:
        type: object
        additionalProperties: false
        required: [gmt, min_size, max_size]
        properties:
          gmt: {type: string, minLength: 1}
          min_size: {type: integer, minimum: 2}
          max_size: {type: integer, minimum: 2}
          collections:
            type: array
            uniqueItems: true
            items: {type: string, minLength: 1}
      cell_state_signatures: {type: string, minLength: 1}
      regulon_edges: {type: string, minLength: 1}
      providers:
        type: object
        additionalProperties: false
        properties:
          msigdb: {type: boolean}
          go: {type: boolean}
          kegg: {type: boolean}
          string: {type: boolean}
          gtrd: {type: boolean}
          dorothea: {type: boolean}
  hypotheses:
    type: object
    additionalProperties: false
    required: [claims, panels]
    properties:
      claims: {type: string, minLength: 1}
      panels: {type: string, minLength: 1}
  publication:
    type: object
    additionalProperties: false
    required: [recipe]
    properties:
      recipe: {type: string, minLength: 1}
  figures:
    type: object
    additionalProperties: false
    required: [group, palette, pca, de, pathways]
    properties:
      group: {type: string, minLength: 1}
      palette:
        type: object
        minProperties: 2
        additionalProperties: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
      pca:
        type: object
        additionalProperties: false
        required: [ellipse_level]
        properties:
          ellipse_level: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
      qc:
        type: object
        additionalProperties: false
        properties:
          top_variable_genes: {type: integer, minimum: 2}
      de:
        type: object
        additionalProperties: false
        required: [fdr, abs_log2fc, top_labels, top_heatmap_genes, z_limit]
        properties:
          fdr: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
          abs_log2fc: {type: number, minimum: 0}
          top_labels: {type: integer, minimum: 0}
          top_heatmap_genes: {type: integer, minimum: 2}
          z_limit: {type: number, exclusiveMinimum: 0}
      pathways:
        type: object
        additionalProperties: false
        required: [top_ora_terms, top_gsva_terms, gsea_curves_per_direction, seed]
        properties:
          top_ora_terms: {type: integer, minimum: 1}
          top_gsva_terms: {type: integer, minimum: 2}
          gsea_curves_per_direction: {type: integer, minimum: 1}
          seed: {type: integer, minimum: 0}
          # Optional GSVA-panel curation (Figure 1F). Omit for the generic
          # default (ssGSEA over every measured set, top-N, clustered).
          gsva_method: {type: string, enum: [ssgsea, gsva]}
          gsva_order: {type: string, enum: [differential, effect]}
          gsva_cluster: {type: boolean}
          gsva_sets:
            type: array
            minItems: 1
            items: {type: string, minLength: 1}
  output:
    type: object
    additionalProperties: false
    required: [root]
    properties:
      root: {type: string, minLength: 1}
allOf:
  - if:
      properties:
        inputs:
          properties:
            kind: {enum: [bam, nfcore_rnaseq, archive]}
    then:
      required: [counting]
$defs:
  sharedInputs:
    type: object
    properties:
      samples: {type: string, minLength: 1}
      analysis_set: {type: string, minLength: 1}
  countInputs:
    type: object
    additionalProperties: false
    required: [kind, counts, samples, annotation]
    properties:
      kind: {const: counts}
      counts: {type: string, minLength: 1}
      samples: {type: string, minLength: 1}
      annotation: {type: string, minLength: 1}
      analysis_set: {type: string, minLength: 1}
  bamInputs:
    type: object
    additionalProperties: false
    required: [kind, bam_root, samples, gtf]
    properties:
      kind: {const: bam}
      bam_root: {type: string, minLength: 1}
      samples: {type: string, minLength: 1}
      gtf: {type: string, minLength: 1}
      analysis_set: {type: string, minLength: 1}
  nfcoreInputs:
    type: object
    additionalProperties: false
    required: [kind, root, samples, gtf, bam_pattern]
    properties:
      kind: {const: nfcore_rnaseq}
      root: {type: string, minLength: 1}
      samples: {type: string, minLength: 1}
      gtf: {type: string, minLength: 1}
      bam_pattern: {type: string, minLength: 1}
      analysis_set: {type: string, minLength: 1}
  archiveInputs:
    type: object
    additionalProperties: false
    required: [kind, archive, samples, gtf]
    properties:
      kind: {const: archive}
      archive: {type: string, minLength: 1}
      member_root: {type: string}
      samples: {type: string, minLength: 1}
      gtf: {type: string, minLength: 1}
      analysis_set: {type: string, minLength: 1}
  counting:
    type: object
    additionalProperties: false
    required:
      - threads
      - feature_type
      - attribute
      - paired_end
      - count_read_pairs
      - require_both_ends_aligned
      - exclude_chimeric_fragments
      - strandedness
      - strand_test_modes
      - strand_min_dominance
    properties:
      threads: {type: integer, minimum: 1}
      feature_type: {type: string, minLength: 1}
      attribute: {type: string, minLength: 1}
      paired_end: {type: boolean}
      count_read_pairs: {type: boolean}
      require_both_ends_aligned: {type: boolean}
      exclude_chimeric_fragments: {type: boolean}
      strandedness: {enum: [infer, unstranded, forward, reverse]}
      strand_test_modes:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: integer, minimum: 0, maximum: 2}
      strand_min_dominance: {type: number, minimum: 0.5, maximum: 1}
