$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required: [hypotheses]
properties:
  study: {type: string}
  hypotheses:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, statement, contrast, expected_direction]
      properties:
        id: {type: string, pattern: "^[a-z0-9][a-z0-9_-]*$"}
        statement: {type: string, minLength: 1}
        contrast: {type: string, minLength: 1}
        expected_direction: {type: string, minLength: 1}
        gene_panels: {type: array, uniqueItems: true, items: {type: string}}
        pathway_panels: {type: array, uniqueItems: true, items: {type: string}}
        pathway_collections: {type: array, uniqueItems: true, items: {type: string}}
        regulators: {type: array, uniqueItems: true, items: {type: string}}
        evidence_threshold: {type: [string, number]}

