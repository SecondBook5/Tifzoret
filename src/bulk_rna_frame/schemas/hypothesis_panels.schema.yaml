$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required: [gene_panels, pathway_panels]
properties:
  gene_panels:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [description, groups]
      properties:
        description: {type: string, minLength: 1}
        color: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
        groups:
          type: object
          minProperties: 1
          additionalProperties:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, minLength: 1}
  pathway_panels:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [description, pathways]
      properties:
        description: {type: string, minLength: 1}
        color: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
        pathways:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [collection, pathway]
            properties:
              collection: {type: string, minLength: 1}
              pathway: {type: string, minLength: 1}
  program_annotations:
    type: object
    additionalProperties: {type: string}
  figure_order:
    type: object
    additionalProperties: false
    properties:
      gene_panels: {type: array, uniqueItems: true, items: {type: string}}
      pathway_panels: {type: array, uniqueItems: true, items: {type: string}}

