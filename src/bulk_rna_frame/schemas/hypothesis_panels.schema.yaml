$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
minProperties: 1
properties:
  programs:
    description: First-class biological programs used by hypotheses and publication panels.
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [label, genes]
      properties:
        label: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        color: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
        genes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        expected_direction: {enum: [increased, decreased, mixed, context_dependent, not_specified]}
        contrast: {type: string, minLength: 1}
  gene_panels:
    description: Legacy-compatible grouped gene panels. New projects should prefer programs.
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [description, groups]
      properties:
        description: {type: string, minLength: 1}
        color: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
        groups:
          type: object
          minProperties: 1
          additionalProperties:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, minLength: 1}
  pathway_panels:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [description, pathways]
      properties:
        description: {type: string, minLength: 1}
        color: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
        pathways:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [collection, pathway]
            properties:
              collection: {type: string, minLength: 1}
              pathway: {type: string, minLength: 1}
              label: {type: string, minLength: 1}
              expected_direction: {enum: [increased, decreased, mixed, context_dependent, not_specified]}
  expected_effects:
    description: Auditable expectations that guide evidence presentation without changing statistical results.
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [contrast, target_type, target, direction]
      properties:
        contrast: {type: string, minLength: 1}
        target_type: {enum: [program, gene, pathway, regulator, cell_state]}
        target: {type: string, minLength: 1}
        direction: {enum: [increased, decreased, mixed, context_dependent, not_specified]}
        rationale: {type: string, minLength: 1}
  program_annotations:
    type: object
    additionalProperties: {type: string}
  program_colors:
    type: object
    additionalProperties: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
  program_order:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  gsea_programs:
    description: Ordered gene-panel identifiers to test and display as focused preranked GSEA curves.
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  constructor_defaults:
    description: Optional presentation defaults keyed by registered constructor id.
    type: object
    additionalProperties:
      type: object
      additionalProperties: true
  figure_order:
    type: object
    additionalProperties: false
    properties:
      gene_panels: {type: array, uniqueItems: true, items: {type: string}}
      pathway_panels: {type: array, uniqueItems: true, items: {type: string}}
anyOf:
  - required: [programs]
  - required: [gene_panels]
  - required: [pathway_panels]
