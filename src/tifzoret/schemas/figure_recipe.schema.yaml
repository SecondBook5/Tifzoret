$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required: [figure_sets]
properties:
  figure_sets:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [width, height, panels]
      properties:
        title: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        width: {type: number, exclusiveMinimum: 0}
        height: {type: number, exclusiveMinimum: 0}
        units: {enum: [in, mm, cm]}
        columns: {type: integer, minimum: 1}
        shared_legends: {type: boolean}
        background: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
        review_dpi: {type: integer, minimum: 72, maximum: 600}
        panels:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]*$"}
              source: {type: string, minLength: 1}
              constructor: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
              contrast: {type: string, minLength: 1}
              variant: {type: string, minLength: 1}
              title: {type: string, minLength: 1}
              caption: {type: string, minLength: 1}
              displayed_data:
                description: Explicit displayed-data paths for a legacy source panel.
                type: array
                uniqueItems: true
                items: {type: string, minLength: 1}
              options:
                description: Audited constructor or placement options recorded with the panel.
                type: object
                additionalProperties: true
              row: {type: integer, minimum: 1}
              column: {type: integer, minimum: 1}
              row_span: {type: integer, minimum: 1}
              column_span: {type: integer, minimum: 1}
              width: {type: number, exclusiveMinimum: 0}
              height: {type: number, exclusiveMinimum: 0}
              show_legend: {type: boolean}
            oneOf:
              - required: [source]
              - required: [constructor]
