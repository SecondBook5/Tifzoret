[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tifzoret"
version = "0.1.0.dev0"
description = "Configuration-driven bulk RNA-seq analysis and publication figure workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "Pillow>=10",
  "pypdf>=4",
  "reportlab>=4",
  "networkx>=3.3",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
workflow = ["snakemake>=8,<10"]
test = ["pytest>=8", "build>=1.2"]

[project.scripts]
tifzoret = "tifzoret.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tifzoret = [
  "schemas/*.yaml",
  "templates/*/*",
  "data/deconvolution/*.tsv",
  "data/deconvolution/*.md",
  "workflow/Snakefile",
  "workflow/rules/*.smk",
  "workflow/envs/*.yaml",
  "workflow/envs/locks/*",
  "workflow/scripts/*.R",
  "workflow/scripts/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
